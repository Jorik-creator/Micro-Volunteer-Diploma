# MicroVolunteer — local development with PostgreSQL
services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://microvolunteer:microvolunteer@db:5432/microvolunteer
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: microvolunteer
      POSTGRES_USER: microvolunteer
      POSTGRES_PASSWORD: microvolunteer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microvolunteer"]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
