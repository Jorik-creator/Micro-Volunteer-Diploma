{% extends "base.html" %}{% load static %}

{% block title %}Немає доступу — MicroVolunteer{% endblock %}
{% block extra_css %}<link href="{% static 'css/pages/admin.css' %}" rel="stylesheet">{% endblock %}

{% block content %}
<div class="container">
  <section class="mv-error">
    <span class="mv-tile mv-tile--lg mv-tile--warning" aria-hidden="true"><i class="bi bi-lock"></i></span>
    <div class="mv-thread" aria-hidden="true"></div>
    <span class="mv-error__code">Помилка 403</span>
    <h1>Немає доступу</h1>
    <p>Ця сторінка доступна лише людям з іншою роллю або учасникам цієї справи.</p>
    <div class="mv-cluster">
      <a class="mv-btn mv-btn--primary" href="{% url 'home' %}"><i class="bi bi-house-door" aria-hidden="true"></i>На головну</a>
      <a class="mv-btn mv-btn--secondary" href="{% url 'requests:list' %}"><i class="bi bi-list-ul" aria-hidden="true"></i>До запитів</a>
    </div>
  </section>
</div>
{% endblock %}
