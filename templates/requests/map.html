{% extends "base.html" %}

{% block title %}Карта запитів — MicroVolunteer{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* Use dvh for accurate viewport on iOS Safari (handles bottom URL bar) */
  #map {
    height: calc(100vh - 72px);
    height: calc(100dvh - 72px);
    width: 100%;
  }
  body.map-page main { overflow: hidden; }
  .leaflet-popup-content .map-details-btn {
    background: var(--mv-blue-600);
    color: #fff !important;
    border: none;
  }
  .leaflet-popup-content .map-details-btn:hover,
  .leaflet-popup-content .map-details-btn:focus {
    background: var(--mv-blue-800);
    color: #fff !important;
    text-decoration: none;
  }
</style>
{% endblock %}

{% block content %}
<div class="map-page-wrap">
  <!-- Toolbar overlay -->
  <div class="map-toolbar">
    <div class="map-toolbar-card">
      <strong class="map-toolbar-title"><i class="bi bi-map me-1"></i>Карта запитів</strong>
      <a href="{% url 'requests:list' %}" class="btn btn-muted btn-sm">
        <i class="bi bi-list-ul"></i> Список
      </a>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Legend toggle (visible on phone) -->
  <button type="button" class="map-legend-toggle" id="map-legend-toggle"
          aria-expanded="false" aria-controls="map-legend">
    <i class="bi bi-info-circle"></i>
    <span>Легенда</span>
  </button>

  <!-- Legend overlay -->
  <div class="map-legend" id="map-legend">
    <button type="button" class="map-legend-close" aria-label="Закрити" id="map-legend-close">
      <i class="bi bi-x-lg"></i>
    </button>
    <span class="map-legend-item"><span class="urgency-dot critical"></span> Критична</span>
    <span class="map-legend-item"><span class="urgency-dot high"></span> Висока</span>
    <span class="map-legend-item"><span class="urgency-dot medium"></span> Середня</span>
    <span class="map-legend-item"><span class="urgency-dot low"></span> Низька</span>
  </div>
</div>

<script>
(function () {
  const toggle = document.getElementById('map-legend-toggle');
  const legend = document.getElementById('map-legend');
  const close  = document.getElementById('map-legend-close');
  if (!toggle || !legend) return;
  toggle.addEventListener('click', function () {
    const open = legend.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  if (close) close.addEventListener('click', function () {
    legend.classList.remove('is-open');
    toggle.setAttribute('aria-expanded', 'false');
  });
})();
</script>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
if (!window.L) {
  document.getElementById('map').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--mv-gray-500)"><div style="text-align:center"><i class="bi bi-map" style="font-size:48px;display:block;margin-bottom:16px"></i><p>Карта недоступна. Перевірте з\'єднання з інтернетом.</p></div></div>';
} else {
(function () {
  const map = L.map('map').setView([50.4501, 30.5234], 10);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20,
  }).addTo(map);

  const urgencyColors = {
    critical: '#dc3545',
    high:     '#ffc107',
    medium:   '#0dcaf0',
    low:      '#198754',
  };

  function makeIcon(urgency) {
    const color = urgencyColors[urgency] || '#6c757d';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="36" viewBox="0 0 24 36">
      <path fill="${color}" stroke="#fff" stroke-width="1.5"
        d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z"/>
      <circle fill="#fff" cx="12" cy="12" r="5"/>
    </svg>`;
    return L.divIcon({
      html: svg,
      iconSize: [24, 36],
      iconAnchor: [12, 36],
      popupAnchor: [0, -36],
      className: '',
    });
  }

  fetch('{% url "requests:map-data" %}')
    .then(r => r.json())
    .then(data => {
      data.forEach(item => {
        L.marker([item.lat, item.lon], { icon: makeIcon(item.urgency) })
          .addTo(map)
          .bindPopup(`
            <strong>${item.title}</strong><br>
            <span class="text-muted">${item.category}</span><br>
            📅 ${item.needed_date}<br>
            ⏱ ${item.duration}<br>
            <a href="${item.url}" class="btn btn-sm btn-primary map-details-btn mt-1">Деталі</a>
          `);
      });
    })
    .catch(() => {
      console.error('Failed to load map data');
    });
})();
}
</script>
{% endblock %}
