{% load mv_ui %}{% if rating.count %}
<div class="mv-cluster">
  <span class="mv-rating mv-h2 mv-mb-0"><i class="bi bi-star-fill" aria-hidden="true"></i>{{ rating.average }}</span>
  <span class="mv-muted">{{ rating.count }} {{ rating.count|uk_plural:"оцінка,оцінки,оцінок" }}</span>
</div>
{% if rating.top_tags %}
<ul class="mv-meta mv-meta--inline mt-3">
  {% for tag in rating.top_tags %}
  <li{% if tag.negative %} class="is-negative"{% endif %}><i class="bi {% if tag.negative %}bi-exclamation-circle{% else %}bi-hand-thumbs-up{% endif %}" aria-hidden="true"></i>{{ tag.label }} · {{ tag.count }}</li>
  {% endfor %}
</ul>
{% endif %}
{% else %}
<p class="mv-muted mv-mb-0"><i class="bi bi-star me-2" aria-hidden="true"></i>Оцінок поки немає.</p>
{% endif %}
