{# Pagination that keeps filters: pass extra_query="a=1&b=2" (without page). #}
{% if is_paginated %}
<nav class="mv-pagination" aria-label="Сторінки">
  {% if page_obj.has_previous %}
  <a class="mv-btn mv-btn--secondary mv-btn--sm" href="?{% if extra_query %}{{ extra_query }}&{% endif %}page={{ page_obj.previous_page_number }}"><i class="bi bi-arrow-left" aria-hidden="true"></i>Попередня</a>
  {% endif %}
  <span class="mv-pagination__info">Сторінка {{ page_obj.number }} з {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
  <a class="mv-btn mv-btn--secondary mv-btn--sm" href="?{% if extra_query %}{{ extra_query }}&{% endif %}page={{ page_obj.next_page_number }}">Наступна<i class="bi bi-arrow-right" aria-hidden="true"></i></a>
  {% endif %}
</nav>
{% endif %}
