{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Реєстрація — MicroVolunteer{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card wide">
    <div class="auth-logo-wrap">
      <span class="auth-logo">
        <i class="bi bi-heart-pulse-fill"></i>
      </span>
    </div>
    <h2 class="auth-title">Створити акаунт</h2>
    <p class="auth-sub">Приєднуйтесь до спільноти волонтерів за хвилину</p>

    <form method="post" novalidate autocomplete="on">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn btn-solid btn-block btn-lg auth-submit">
        <i class="bi bi-check-circle"></i> Зареєструватися
      </button>
    </form>

    <p class="auth-footer-text">
      Вже маєте акаунт? <a href="{% url 'accounts:login' %}">Увійти</a>
    </p>
  </div>
</div>
{% endblock %}
