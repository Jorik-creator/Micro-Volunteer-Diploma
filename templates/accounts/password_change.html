{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Змінити пароль — MicroVolunteer{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h2 class="auth-title">Змінити пароль</h2>
    <p class="auth-sub">Введіть поточний та новий пароль</p>

    <form method="post" novalidate>
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn btn-solid btn-block btn-lg auth-submit">
        <i class="bi bi-key"></i> Змінити пароль
      </button>
    </form>

    <p class="auth-footer-text">
      <a href="{% url 'accounts:profile' %}"><i class="bi bi-arrow-left"></i> До профілю</a>
    </p>
  </div>
</div>
{% endblock %}
