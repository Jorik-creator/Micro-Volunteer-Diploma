{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Перевірте пошту — MicroVolunteer{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo-wrap"><span class="auth-logo"><i class="bi bi-envelope-check"></i></span></div>
    <h1 class="auth-title">Перевірте пошту</h1>
    <p class="auth-sub">Якщо акаунт з такою адресою існує, лист із посиланням уже в дорозі. Перевірте також папку «Спам».</p>
    <p class="auth-footer-text"><a href="{% url 'accounts:login' %}">Повернутися до входу</a></p>
  </div>
</div>
{% endblock %}
