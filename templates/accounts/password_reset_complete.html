{% extends "base.html" %}
{% load static %}

{% block title %}Пароль змінено — MicroVolunteer{% endblock %}
{% block extra_css %}<link href="{% static 'css/pages/account.css' %}" rel="stylesheet">{% endblock %}

{% block content %}
<div class="mv-auth mv-auth--single">
  <div class="mv-auth__form">
    <div class="mv-auth__card mv-auth__card--center mv-card">
      <div class="mv-auth__head">
        <span class="mv-tile mv-tile--lg mv-tile--success" aria-hidden="true"><i class="bi bi-check2-circle"></i></span>
        <h1>Пароль змінено</h1>
      </div>
      <p class="mv-muted">Тепер можна увійти з новим паролем.</p>
      <a href="{% url 'accounts:login' %}" class="mv-btn mv-btn--primary mv-btn--lg mv-btn--block">
        <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>Увійти
      </a>
    </div>
  </div>
</div>
{% endblock %}
