{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Пароль змінено — MicroVolunteer{% endblock %}

{% block content %}

  <div class="auth-card">
    <div class="auth-logo-wrap"><span class="auth-logo"><i class="bi bi-check2-circle"></i></span></div>

  </div>
</div>
{% endblock %}
