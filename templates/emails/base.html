<!DOCTYPE html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#F3F4F6;font-family:Arial,Helvetica,sans-serif;color:#0F2349;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3F4F6;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;">
        <tr><td style="padding:24px 28px 0;font-size:18px;font-weight:700;color:#2563EB;">MicroVolunteer</td></tr>
        <tr><td style="padding:12px 28px 28px;font-size:16px;line-height:1.6;">{% block content %}{% endblock %}</td></tr>
      </table>
      <p style="font-size:12px;color:#6B7280;margin-top:16px;">{% block footer %}Ви отримали цей лист, бо зареєстровані на MicroVolunteer.{% endblock %}</p>
    </td></tr>
  </table>
</body>
</html>
