{% extends "emails/base.html" %}
{% block content %}
<p>Вітаємо, {{ user.first_name|default:user.username }}!</p>
<p>Хтось (сподіваємося, ви) попросив змінити пароль до MicroVolunteer.</p>
<p style="margin:28px 0;"><a href="{{ protocol }}://{{ domain }}{% url 'accounts:password-reset-confirm' uidb64=uid token=token %}" style="background:#2563EB;color:#ffffff;padding:14px 24px;border-radius:999px;text-decoration:none;font-weight:600;display:inline-block;">Задати новий пароль</a></p>
<p style="color:#6B7280;font-size:14px;">Якщо це були не ви — просто проігноруйте лист, пароль не зміниться.</p>
{% endblock %}
